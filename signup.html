<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sign Up | The Luxury Perfumes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body bgcolor="white" text="black">

    <!-- GLOBAL HEADER & NAVIGATION -->
    <table width="100%" cellpadding="10" cellspacing="0" border="0">
        <tr align="center">
            <td>
                <h1><font face="Times New Roman" size="7"><b>T H E &nbsp; L U X U R Y &nbsp; P E R F U M E S</b></font></h1>
                <img src="_image/logo.jpg" alt="Logo">
                <hr width="85%" size="1" color="black" />
                <p>
                    <font face="Times New Roman" size="3">
                        <a href="index.html">HOME</a> &nbsp;|&nbsp;
                        <a href="products.html">PRODUCTS & SERVICES</a> &nbsp;|&nbsp;
                        <a href="about.html">ABOUT US</a> &nbsp;|&nbsp;
                        <a href="enquiries.html">ENQUIRIES</a> &nbsp;|&nbsp;
                        <a href="contacts.html">CONTACTS</a> &nbsp;|&nbsp;
                        <a href="signup.html"><b>SIGN UP</b></a> &nbsp;|&nbsp;
                        <a href="login.html">LOGIN</a>
                    </font>
                </p>
                <hr width="85%" size="1" color="black" />
            </td>
        </tr>
    </table>

    <br /><br />

    <!-- SIGN UP FORM (CENTERED TABLE) -->
    <form id="signupForm">
        <table align="center" cellpadding="8" cellspacing="0" border="0">
            <tr>
                <td align="right"><b>First Name:</b></td>
                <td align="left"><input type="text" id="firstname" name="firstname" size="30" required /></td>
            </tr>
            <tr>
                <td align="right"><b>Last Name:</b></td>
                <td align="left"><input type="text" id="lastname" name="lastname" size="30" required /></td>
            </tr>
            <tr>
                <td align="right"><b>Email Address:</b></td>
                <td align="left"><input type="email" id="email" name="email" size="30" required /></td>
            </tr>
            <tr>
                <td align="right"><b>Create Password:</b></td>
                <td align="left"><input type="password" id="password" name="password" size="30" minlength="8" required /></td>
            </tr>
            <tr>
                <td align="right"><b>Favorite Perfume:</b></td>
                <td align="left">
                    <select id="favorite_brand" name="favorite_brand" required>
                        <option value="chanel">Chanel</option>
                        <option value="dior">Dior</option>
                        <option value="valentino">Valentino</option>
                        <option value="versace">Versace</option>
                        <option value="dg">Dolce & Gabbana</option>
                    </select>
                </td>
            </tr>
            <tr align="center">
                <td colspan="2">
                    <br />
                    <input type="submit" value="REGISTER ACCOUNT" />
                </td>
            </tr>
        </table>
    </form>

    <br /><br /><hr width="85%" size="1" color="black" />

    <!-- FOOTER -->
    <table width="100%" cellpadding="10" border="0">
        <tr align="center">
            <td><p><font face="Times New Roman" size="2">&copy; 2026 THE LUXURY PERFUMES. ALL RIGHTS RESERVED.</font></p></td>
        </tr>
    </table>

    <script src="js_assets/forms.js"></script>
    <script src="js_assets/main.js"></script>

</body>
</html>
